name: build-base-es

# Prueba, construye y publica Superset con las traducciones compiladas.
#  - En cualquier rama: pruebas + construcción (sin publicar).
#  - En main o a mano (workflow_dispatch): lo anterior y, si todo pasa, publica en GHCR.
# Solo hace falta publicar al cambiar de versión de Superset (o de idiomas).
on:
  workflow_dispatch:
    inputs:
      superset_version:
        description: "Versión de Superset (etiqueta de apache/superset)"
        default: "6.1.0"
        required: true
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]

permissions:
  contents: read
  packages: write

env:
  SUPERSET_VERSION: ${{ inputs.superset_version || '6.1.0' }}

jobs:
  pruebas-unitarias:
    name: Pruebas de compile_mo.py
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install babel==2.17.0 pytest
      - run: pytest -q tests

  lint-dockerfile:
    name: Revisión del Dockerfile (hadolint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  imagen:
    name: Construir, probar y publicar la imagen
    needs: [pruebas-unitarias, lint-dockerfile]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Nombre de imagen en minúsculas
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # 1) Se construye SIN publicar y se carga en el runner para probarla.
      - name: Construir (sin publicar)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            SUPERSET_VERSION=${{ env.SUPERSET_VERSION }}
          tags: superset-es-base:prueba
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2) Pruebas funcionales y de seguridad sobre la imagen construida.
      - name: Pruebas de la imagen (funcionales y de seguridad)
        run: bash tests/smoke.sh superset-es-base:prueba es

      # 3) Escaneo de vulnerabilidades. Solo informa (la imagen oficial de Superset ya trae las suyas); no bloquea.
      - name: Escaneo de vulnerabilidades (Trivy, informativo)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: superset-es-base:prueba
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      # 4) Solo en main o a mano, y solo si todo lo anterior pasó: se publica (usa la caché: no recompila).
      - name: Iniciar sesión en GHCR
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            SUPERSET_VERSION=${{ env.SUPERSET_VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ env.SUPERSET_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
